name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # The engine, the analysis, the booklet transcriptions and the solver.
      - name: Unit tests
        run: node --test *.test.mjs

      # The routed app, driven headlessly through jsdom.
      - name: App smoke test
        run: node app.smoke.mjs

      # Catches the animation code silently never running.
      - name: Motion smoke test
        run: node motion.smoke.mjs

      - name: Build the single-file bundle
        run: npm run build

      # The bundle must behave exactly like the module build.
      - name: Bundle smoke test
        run: npm run verify

      - name: Assemble the site
        run: |
          mkdir -p dist
          cp index.html switchback.html *.mjs dist/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
